name: BTC Upstream Distributor Chain

on:
  push:
    branches:
      - agent/btc-onchain-probe-20260902
    paths:
      - '.github/workflows/btc-upstream-distributor.yml'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify exact upstream fan-out geometry
        shell: bash
        run: |
          python - <<'PY'
          import json,re,time,urllib.request
          from pathlib import Path
          from html import unescape

          WALLETS=['d32c53c4e37a5939','3aa95dcf70eede85','346a258fe5e120a0','1cb62fb9f4a1cf9c']
          TXIDS=[
            '009cd5be97ec0b50aecb4ece63b4ea24a89a149944bcba68534e052d7ced440e',
            'ea4b8dd153de26cb1b7e5b55869db7c41f6f82f043fc75486d22390eaab9cf08',
            '92101a57482122f3eaf278fb35f2bf0d699c43398798d5c954da0913c5077f65',
            '3d3f3beb0d21562717a2844aaf5c22e757d73ddb79460adcb2d15a7ee42e2e39',
          ]
          out=Path('btc_upstream_distributor'); out.mkdir(exist_ok=True)

          def get(url,retries=5):
              last=None
              for attempt in range(retries):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 OSINT-deepseek/1.0'})
                      with urllib.request.urlopen(req,timeout=30) as r:return r.read().decode('utf-8','replace')
                  except Exception as e:
                      last=e; time.sleep(min(8,2**attempt))
              raise last

          def label(address):
              try:
                  html=get(f'https://www.walletexplorer.com/address/{address}')
                  m=re.search(r'data-wallet-id="([0-9a-f]+)".*?<span class="wallet_name">([^<]+)</span>',html,re.I|re.S)
                  if m:return {'wallet_id':m.group(1),'wallet_name':unescape(m.group(2)).strip()}
              except Exception as e:return {'error':repr(e)}
              return None

          wallet_pages={}
          for wid in WALLETS:
              html=get(f'https://www.walletexplorer.com/wallet/{wid}')
              (out/f'wallet_{wid}.html').write_text(html,encoding='utf-8')
              wallet_pages[wid]=html

          txs=[]
          for txid in TXIDS:
              txt=get(f'https://blockstream.info/api/tx/{txid}')
              tx=json.loads(txt); (out/f'tx_{txid}.json').write_text(txt,encoding='utf-8')
              ins=[]; outs=[]
              for vin in tx.get('vin',[]):
                  p=vin.get('prevout') or {}; a=p.get('scriptpubkey_address'); v=p.get('value') or 0
                  ins.append({'address':a,'sat':v,'btc':round(v/1e8,8),'wallet':label(a) if a else None})
              for vout in tx.get('vout',[]):
                  a=vout.get('scriptpubkey_address'); v=vout.get('value') or 0
                  outs.append({'address':a,'sat':v,'btc':round(v/1e8,8),'wallet':label(a) if a else None})
              txs.append({'txid':txid,'block_time':(tx.get('status') or {}).get('block_time'),'inputs':ins,'outputs':outs,'fee_sat':tx.get('fee')})
              time.sleep(.15)

          # quantify repeated output values and sibling named services
          geometry=[]
          for tx in txs:
              counts={}
              named=[]
              for o in tx['outputs']:
                  counts[str(o['sat'])]=counts.get(str(o['sat']),0)+1
                  w=o.get('wallet') or {}
                  name=w.get('wallet_name') if isinstance(w,dict) else None
                  if name and not name.startswith('['): named.append({'name':name,'btc':o['btc'],'address':o['address']})
              geometry.append({'txid':tx['txid'],'output_value_counts':counts,'named_service_outputs':named})

          result={'transactions':txs,'geometry':geometry}
          (out/'distributor_exact.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: btc-upstream-distributor
          path: btc_upstream_distributor/
          if-no-files-found: error
          retention-days: 7
