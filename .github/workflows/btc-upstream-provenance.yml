name: BTC Upstream Provenance

on:
  push:
    branches:
      - agent/btc-onchain-probe-20260902
    paths:
      - '.github/workflows/btc-upstream-provenance.yml'

permissions:
  contents: read

jobs:
  upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trace incoming wallet relationships
        shell: bash
        run: |
          python - <<'PY'
          import json,re,time,urllib.request
          from pathlib import Path
          from html import unescape

          TARGET_WALLET='00421c7e25459ed4'
          out=Path('btc_upstream_provenance'); out.mkdir(exist_ok=True)

          def get(url,retries=5):
              last=None
              for attempt in range(retries):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 OSINT-deepseek/1.0'})
                      with urllib.request.urlopen(req,timeout=30) as r:return r.read().decode('utf-8','replace')
                  except Exception as e:
                      last=e; time.sleep(min(8,2**attempt))
              raise last

          html=get(f'https://www.walletexplorer.com/wallet/{TARGET_WALLET}')
          (out/'target_wallet.html').write_text(html,encoding='utf-8')
          parts=re.split(r'<tr class="(sent|received)">',html,flags=re.I)
          rows=[]
          source_wallets={}
          for i in range(1,len(parts),2):
              direction=parts[i].lower(); body=parts[i+1]
              if direction!='received': continue
              dm=re.search(r'<td class="date">([^<]+)</td>',body,re.I)
              tm=re.search(r'/txid/([0-9a-f]{64})',body,re.I)
              am=re.search(r'<td class="amount diff">\s*(?:<em>)?\s*([+-]?[0-9.]+)',body,re.I)
              # all wallet references in the nested counterparty section
              refs=[]
              for wm in re.finditer(r'data-wallet-id="([0-9a-f]+)".*?<span class="wallet_name">([^<]+)</span>',body,re.I|re.S):
                  wid=wm.group(1); name=unescape(wm.group(2)).strip()
                  refs.append({'wallet_id':wid,'wallet_name':name})
                  if wid != TARGET_WALLET: source_wallets[wid]=name
              if dm and tm and am:
                  rows.append({'date':dm.group(1).strip(),'txid':tm.group(1),'wallet_net_btc':float(am.group(1)),'counterparty_wallets':refs})

          profiles=[]
          for wid,name in sorted(source_wallets.items()):
              rec={'wallet_id':wid,'wallet_name_from_target':name}
              try:
                  wh=get(f'https://www.walletexplorer.com/wallet/{wid}')
                  (out/f'wallet_{wid}.html').write_text(wh,encoding='utf-8')
                  txc=re.search(r'total transactions:\s*([0-9,]+)',wh,re.I)
                  rec['transactions']=txc.group(1) if txc else None
                  dates=re.findall(r'<td class="date">([^<]+)</td>',wh,re.I)
                  rec['newest_date_page']=dates[0].strip() if dates else None
                  rec['oldest_date_page']=dates[-1].strip() if dates else None
                  labels=sorted(set(unescape(x).strip() for x in re.findall(r'<span class="wallet_name">([^<]+)</span>',wh,re.I)))
                  rec['wallet_labels_seen_on_page']=[x for x in labels if x and not x.startswith('[')]
                  # exact service names and wallet ids referenced as counterparties
                  services=[]
                  for wm in re.finditer(r'data-wallet-id="([0-9a-f]+)".*?<span class="wallet_name">([^<]+)</span>',wh,re.I|re.S):
                      nm=unescape(wm.group(2)).strip()
                      if nm and not nm.startswith('['): services.append({'wallet_id':wm.group(1),'name':nm})
                  rec['service_counterparties']=services
              except Exception as e:
                  rec['error']=repr(e)
              profiles.append(rec); time.sleep(.15)

          result={'target_wallet':TARGET_WALLET,'incoming_rows':rows,'source_wallet_profiles':profiles}
          (out/'upstream.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print('=== INCOMING ROWS ==='); print(json.dumps(rows,ensure_ascii=False,indent=2))
          print('=== SOURCE PROFILES ==='); print(json.dumps(profiles,ensure_ascii=False,indent=2))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: btc-upstream-provenance
          path: btc_upstream_provenance/
          if-no-files-found: error
          retention-days: 7
