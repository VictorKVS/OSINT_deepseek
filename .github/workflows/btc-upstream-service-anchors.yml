name: BTC Upstream Service Anchors

on:
  push:
    branches:
      - agent/btc-onchain-probe-20260902
    paths:
      - '.github/workflows/btc-upstream-service-anchors.yml'

permissions:
  contents: read

jobs:
  anchors:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve upstream source histories
        shell: bash
        run: |
          python - <<'PY'
          import json,re,time,urllib.request
          from pathlib import Path
          from html import unescape

          SEEDS=['17501b5a1c1c594e','1cb62fb9f4a1cf9c','dc6329c5599ca457']
          out=Path('btc_upstream_service_anchors'); out.mkdir(exist_ok=True)

          def get(url,retries=5):
              last=None
              for attempt in range(retries):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 OSINT-deepseek/1.0'})
                      with urllib.request.urlopen(req,timeout=30) as r:return r.read().decode('utf-8','replace')
                  except Exception as e:
                      last=e; time.sleep(min(8,2**attempt))
              raise last

          def parse_wallet(wid):
              html=get(f'https://www.walletexplorer.com/wallet/{wid}')
              (out/f'wallet_{wid}.html').write_text(html,encoding='utf-8')
              parts=re.split(r'<tr class="(sent|received)">',html,flags=re.I)
              rows=[]
              for i in range(1,len(parts),2):
                  direction=parts[i].lower(); body=parts[i+1]
                  dm=re.search(r'<td class="date">([^<]+)</td>',body,re.I)
                  tm=re.search(r'/txid/([0-9a-f]{64})',body,re.I)
                  am=re.search(r'<td class="amount diff">\s*(?:<em>)?\s*([+-]?[0-9.]+)',body,re.I)
                  refs=[]
                  for wm in re.finditer(r'data-wallet-id="([0-9a-f]+)".*?<span class="wallet_name">([^<]+)</span>',body,re.I|re.S):
                      refs.append({'wallet_id':wm.group(1),'wallet_name':unescape(wm.group(2)).strip()})
                  if dm and tm and am:
                      rows.append({'direction':direction,'date':dm.group(1).strip(),'txid':tm.group(1),'wallet_net_btc':float(am.group(1)),'counterparty_wallets':refs})
              return rows

          first=[]; second_ids={}
          for wid in SEEDS:
              rows=parse_wallet(wid)
              first.append({'wallet_id':wid,'rows':rows})
              for r in rows:
                  for cp in r['counterparty_wallets']:
                      if cp['wallet_id'] not in SEEDS and cp['wallet_name'].startswith('['):
                          second_ids[cp['wallet_id']]=cp['wallet_name']

          second=[]
          for wid,name in sorted(second_ids.items()):
              try:
                  rows=parse_wallet(wid)
                  services=sorted({cp['wallet_name'] for r in rows for cp in r['counterparty_wallets'] if not cp['wallet_name'].startswith('[')})
                  second.append({'wallet_id':wid,'name':name,'services':services,'rows':rows})
              except Exception as e:
                  second.append({'wallet_id':wid,'name':name,'error':repr(e)})
              time.sleep(.12)

          result={'seed_histories':first,'second_hop_unlabeled':second}
          (out/'anchors.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print('=== SEEDS ==='); print(json.dumps(first,ensure_ascii=False,indent=2))
          print('=== SECOND HOP ==='); print(json.dumps(second,ensure_ascii=False,indent=2))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: btc-upstream-service-anchors
          path: btc_upstream_service_anchors/
          if-no-files-found: error
          retention-days: 7
