name: BTC Upstream Wallet Histories

on:
  push:
    branches:
      - agent/btc-onchain-probe-20260902
    paths:
      - '.github/workflows/btc-upstream-wallet-history.yml'

permissions:
  contents: read

jobs:
  upstream-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Expand small upstream wallets
        shell: bash
        run: |
          python - <<'PY'
          import json,re,time,urllib.request
          from pathlib import Path
          from html import unescape

          WALLETS=['09c407c4ad1d62ac','586bf68ada3616e9','5b251d80777cd7ff']
          out=Path('btc_upstream_histories'); out.mkdir(exist_ok=True)

          def get(url,retries=5):
              last=None
              for attempt in range(retries):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 OSINT-deepseek/1.0'})
                      with urllib.request.urlopen(req,timeout=30) as r:return r.read().decode('utf-8','replace')
                  except Exception as e:
                      last=e; time.sleep(min(8,2**attempt))
              raise last

          results=[]
          all_neighbors={}
          for wid in WALLETS:
              html=get(f'https://www.walletexplorer.com/wallet/{wid}')
              (out/f'wallet_{wid}.html').write_text(html,encoding='utf-8')
              parts=re.split(r'<tr class="(sent|received)">',html,flags=re.I)
              rows=[]
              for i in range(1,len(parts),2):
                  direction=parts[i].lower(); body=parts[i+1]
                  dm=re.search(r'<td class="date">([^<]+)</td>',body,re.I)
                  tm=re.search(r'/txid/([0-9a-f]{64})',body,re.I)
                  am=re.search(r'<td class="amount diff">\s*(?:<em>)?\s*([+-]?[0-9.]+)',body,re.I)
                  refs=[]
                  for wm in re.finditer(r'data-wallet-id="([0-9a-f]+)".*?<span class="wallet_name">([^<]+)</span>',body,re.I|re.S):
                      nwid=wm.group(1); name=unescape(wm.group(2)).strip()
                      refs.append({'wallet_id':nwid,'wallet_name':name})
                      if nwid not in WALLETS:
                          all_neighbors[nwid]=name
                  if dm and tm and am:
                      rows.append({'direction':direction,'date':dm.group(1).strip(),'txid':tm.group(1),'wallet_net_btc':float(am.group(1)),'counterparty_wallets':refs})
              results.append({'wallet_id':wid,'rows':rows})

          profiles=[]
          for wid,name in sorted(all_neighbors.items()):
              rec={'wallet_id':wid,'name_seen':name}
              try:
                  html=get(f'https://www.walletexplorer.com/wallet/{wid}')
                  (out/f'neighbor_{wid}.html').write_text(html,encoding='utf-8')
                  txc=re.search(r'total transactions:\s*([0-9,]+)',html,re.I)
                  rec['transactions']=txc.group(1) if txc else None
                  dates=re.findall(r'<td class="date">([^<]+)</td>',html,re.I)
                  rec['newest_date_page']=dates[0].strip() if dates else None
                  rec['oldest_date_page']=dates[-1].strip() if dates else None
                  names=sorted(set(unescape(x).strip() for x in re.findall(r'<span class="wallet_name">([^<]+)</span>',html,re.I)))
                  rec['named_services_seen']=[x for x in names if x and not x.startswith('[')]
              except Exception as e: rec['error']=repr(e)
              profiles.append(rec); time.sleep(.12)

          result={'wallet_histories':results,'neighbor_profiles':profiles}
          (out/'upstream_histories.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print('=== WALLET HISTORIES ==='); print(json.dumps(results,ensure_ascii=False,indent=2))
          print('=== NEIGHBOR PROFILES ==='); print(json.dumps(profiles,ensure_ascii=False,indent=2))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: btc-upstream-wallet-histories
          path: btc_upstream_histories/
          if-no-files-found: error
          retention-days: 7
