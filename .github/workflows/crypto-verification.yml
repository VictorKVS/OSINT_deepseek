name: Crypto Evidence Verification

on:
  push:
    branches:
      - agent/crypto-intake-v1-20260902
    paths:
      - 'father_osint/crypto/**'
      - 'tests/test_crypto_bitcoin.py'
      - '.github/workflows/crypto-verification.yml'
  pull_request:
    paths:
      - 'father_osint/crypto/**'
      - 'tests/test_crypto_bitcoin.py'
      - '.github/workflows/crypto-verification.yml'

permissions:
  contents: read

jobs:
  bitcoin-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install 'pytest>=9,<10'
      - name: Compile crypto package
        run: python -m compileall -q father_osint/crypto
      - name: Run Bitcoin evidence regressions
        run: python -m pytest -q tests/test_crypto_bitcoin.py
