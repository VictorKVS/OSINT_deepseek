name: Stage 06 DEV Verification

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install current DEV verification dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify current DEV baseline
        run: |
          python -c "import father_osint; print('father_osint import: OK')"
          python -m pytest --collect-only -q
          python -m pytest -q
          python scripts/run_dev_osint.py
          python scripts/run_dev_pipeline.py
