name: Stage 06 DEV Verification

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install current DEV verification dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify current DEV baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .test-results/junit .test-results/logs
          {
            python -c "import father_osint; print('father_osint import: OK')"
            python -m pytest --collect-only -q 2>&1 | tee .test-results/logs/pytest-collect.log
            python -m pytest -q --junitxml=.test-results/junit/pytest.xml 2>&1 | tee .test-results/logs/pytest.log
            python scripts/run_dev_osint.py 2>&1 | tee .test-results/logs/run-dev-osint.log
            python scripts/run_dev_pipeline.py 2>&1 | tee .test-results/logs/run-dev-pipeline.log
          }

      - name: Write DEV verification manifest
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import json, os, platform, sys
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('.test-results')
          root.mkdir(parents=True, exist_ok=True)
          result_files = [
              str(p.relative_to(root)).replace('\\', '/')
              for p in root.rglob('*') if p.is_file()
          ]
          manifest = {
              'schema_version': '1.0',
              'project': 'OSINT_deepseek',
              'repository': os.environ.get('GITHUB_REPOSITORY'),
              'commit_sha': os.environ.get('GITHUB_SHA'),
              'ref': os.environ.get('GITHUB_REF'),
              'workflow': os.environ.get('GITHUB_WORKFLOW'),
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
              'archived_at_utc': datetime.now(timezone.utc).isoformat(),
              'status': os.environ.get('JOB_STATUS', 'unknown').upper(),
              'runtime': {
                  'python': sys.version,
                  'platform': platform.platform(),
              },
              'commands': [
                  "python -c import father_osint",
                  'python -m pytest --collect-only -q',
                  'python -m pytest -q --junitxml=.test-results/junit/pytest.xml',
                  'python scripts/run_dev_osint.py',
                  'python scripts/run_dev_pipeline.py',
              ],
              'result_files': sorted(result_files),
          }
          (root / 'manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )
          PY

      - name: Archive DEV verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-osint-deepseek-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: .test-results
          if-no-files-found: warn
          retention-days: 90
