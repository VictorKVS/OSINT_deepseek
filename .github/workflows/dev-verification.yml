name: Stage 06 DEV Verification

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install current DEV verification dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify current DEV baseline and additive Knowledge Factory tests
        run: |
          python -c "import father_osint; print('father_osint import: OK')"
          python -m pytest --collect-only -q
          python -m pytest -q
          python scripts/run_dev_osint.py
          python scripts/run_dev_pipeline.py
