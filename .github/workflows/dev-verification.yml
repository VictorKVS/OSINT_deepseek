name: Stage 06 DEV Verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependency
        run: python -m pip install --upgrade pytest

      - name: Import check
        run: python -c "import father_osint; print('father_osint import: OK')"

      - name: Collect tests
        run: pytest --collect-only -q

      - name: Run tests
        run: pytest -q

      - name: Run DEV OSINT fixture scenario
        run: python scripts/run_dev_osint.py

      - name: Run legacy DEV pipeline diagnostic
        continue-on-error: true
        run: python scripts/run_dev_pipeline.py
