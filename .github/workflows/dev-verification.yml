name: Stage 06 DEV Verification

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --upgrade pytest

      - name: Import check
        run: python -c "import father_osint; print('father_osint import: OK')"

      - name: Collect tests
        run: python -m pytest --collect-only -q

      - name: Run tests
        run: python -m pytest -q

      - name: Run DEV OSINT fixture scenario
        run: python scripts/run_dev_osint.py

      - name: Run canonical DEV review pipeline scenario
        run: python scripts/run_dev_pipeline.py
