name: OSINT Workbench Core MVP

on:
  push:
    paths:
      - 'osint_workbench/**'
      - 'tests/*osint_workbench*.py'
      - 'scripts/run_osint_workbench_demo.py'
      - 'scripts/validate_osint_workbench_demo.py'
      - 'docs/osint-platform/**'
      - 'RUN_OSINT_WORKBENCH_*.cmd'
      - '.github/workflows/osint-workbench-core.yml'
  pull_request:
    paths:
      - 'osint_workbench/**'
      - 'tests/*osint_workbench*.py'
      - 'scripts/run_osint_workbench_demo.py'
      - 'scripts/validate_osint_workbench_demo.py'
      - 'docs/osint-platform/**'
      - 'RUN_OSINT_WORKBENCH_*.cmd'
      - '.github/workflows/osint-workbench-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install verification dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -r docs/osint-platform/validation/requirements.txt

      - name: Compile new core
        run: python -m compileall -q osint_workbench scripts/run_osint_workbench_demo.py scripts/validate_osint_workbench_demo.py

      - name: Run core tests
        run: python -m pytest -q tests/test_osint_workbench_*.py

      - name: Run synthetic vertical demo
        run: python scripts/run_osint_workbench_demo.py --root data/osint-workbench-demo --force

      - name: Validate generated objects against baseline contracts
        run: |
          python scripts/validate_osint_workbench_demo.py \
            --root data/osint-workbench-demo \
            --case-id CASE-SYNTH-CORE-0001 \
            --schemas docs/osint-platform/schemas \
            --output data/osint-workbench-demo/validation-result.json

      - name: Verify journal through operator CLI
        run: python -m osint_workbench --root data/osint-workbench-demo verify-journal CASE-SYNTH-CORE-0001
