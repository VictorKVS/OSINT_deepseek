signal_types:
  - BREAKTHROUGH
  - NEW_PRODUCT
  - NEW_OPEN_SOURCE
  - NEW_STANDARD
  - NEW_RESEARCH
  - BENCHMARK
  - PRICE_CHANGE
  - PERFORMANCE_CHANGE
  - SECURITY_INCIDENT
  - FAILURE_CASE
  - ACQUISITION_OR_PARTNERSHIP
  - PLATFORM_STRATEGY
  - REGULATORY_CHANGE
  - TALENT_SIGNAL
  - TECHNOLOGY_HORIZON_UNLOCK

source_classes:
  primary:
    priority: 1.0
    examples:
      - official documentation
      - source repositories
      - research paper originals
      - standards bodies
      - regulator publications
      - company engineering/research announcements
  independent_technical:
    priority: 0.9
    examples:
      - reproducible benchmark
      - independent engineering analysis
      - conference proceedings
  specialist_media:
    priority: 0.65
  community_signal:
    priority: 0.45
    note: discovery lead; corroboration normally required for material claims
  telegram_signal:
    priority: 0.4
    note: watch source; trace significant claims to primary evidence when possible

routing:
  AI_MODELS:
    - AI_LLM_KB
    - AGENT_ENGINEERING_KB
    - ARCHITECTURE_KB
    - COST_KB
  AGENTIC_SYSTEMS:
    - AGENT_ENGINEERING_KB
    - ARCHITECTURE_KB
    - TESTING_KB
  KNOWLEDGE_SYSTEMS:
    - KNOWLEDGE_ENGINEERING_KB
    - ARCHITECTURE_KB
  SOFTWARE_ENGINEERING:
    - DEVELOPER_KB
    - DEVSECOPS_KB
    - TESTING_KB
  COMPUTE_HARDWARE:
    - INFRASTRUCTURE_KB
    - FINOPS_KB
    - TECHNOLOGY_HORIZONS
  SECURITY:
