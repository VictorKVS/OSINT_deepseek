profile:
  id: HIGH_TECH_INTELLIGENCE
  version: 0.1
  status: draft
  mission: >
    Detect technologies, methods, products, research results, failures and market moves
    that can materially improve or threaten FATHER, its product factories or expert knowledge bases.

