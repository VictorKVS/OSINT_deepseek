    - PRODUCT_FACTORY_KB
  BIOTECH_MATERIALS:
    - TECHNOLOGY_HORIZONS
  SPACE:
    - TECHNOLOGY_HORIZONS

escalation:
  immediate_review_when:
    - impacts current FATHER architecture materially
    - indicates critical vulnerability or active supply-chain risk
    - changes cost or performance assumptions materially
    - provides strong evidence that a current architecture decision is obsolete
    - unlocks a watched technology horizon
    - contradicts an ACTIVE Survival Rule or major knowledge object

output_policy:
  default_status: DISCOVERED
  autonomous_verified_promotion: false
  preserve_raw_provenance: true
  require_socrates_for_material_claims: true
  require_independent_corroboration_when_reasonable: true
